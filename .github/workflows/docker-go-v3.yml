name: Build and Push Go Docker Image (v3 React UI)

# Builds ghcr.io/<owner>/monstrobook:v3: the official v3 React web client
# (ghcr.io/advplyr/audiobookshelf:v3) served by the Monstrobook Go server.
# Pull requests build the image without pushing.

on:
  push:
    branches: [master]
    tags:
      - 'v*'
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/docker-go-v3.yml'
      - '.github/workflows/go-backend.yml'
  pull_request:
    paths:
      - 'Dockerfile'
      - 'go.mod'
      - 'go.sum'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/docker-go-v3.yml'
      - '.github/workflows/go-backend.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CGO_ENABLED: '0'

jobs:
  verify:
    name: Unified replacement verification
    uses: ./.github/workflows/go-backend.yml

  image:
    name: Build and push v3 image
    needs: [verify]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/monstrobook
          tags: |
            type=raw,value=v3,enable={{is_default_branch}}
            type=sha,prefix=v3-sha-
            type=semver,pattern=v3-{{version}}
            type=ref,event=pr,suffix=-v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ghcr
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          build-args: |
            VCS_REF=${{ github.sha }}
            WEBUI_IMAGE=ghcr.io/advplyr/audiobookshelf:v3
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
